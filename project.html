<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Project Details | MOHAMMED BABEKER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', 'Tajawal', sans-serif; }
        .text-glow { text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-sky-500 selection:text-white min-h-[100dvh] flex flex-col justify-between">

    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 z-40 bg-slate-950/70 backdrop-blur-md border-b border-slate-800/60 px-4 sm:px-8 py-3 flex justify-between items-center">
        <a href="index.html" class="text-xs sm:text-lg font-black text-white tracking-wider uppercase whitespace-nowrap">
            MOHAMMED BABEKER<span class="text-sky-500">.</span>
        </a>
        
        <div class="flex items-center gap-3">
            <!-- Language Switcher -->
            <div class="inline-flex bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs font-bold">
                <button id="langEnBtn" onclick="switchLanguage('en')" class="px-2.5 py-1 rounded-lg bg-sky-500 text-white transition-all">EN</button>
                <button id="langArBtn" onclick="switchLanguage('ar')" class="px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition-all">عربي</button>
            </div>
            
            <a href="index.html" class="px-4 py-1.5 rounded-full bg-sky-500 text-white text-xs font-extrabold hover:bg-sky-400 transition-all shadow-lg shadow-sky-500/25">
                <span id="txt-back">← Back to Home</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow pt-24 sm:pt-28 pb-16 px-4 sm:px-6 max-w-5xl mx-auto w-full">
        <div id="projectContainer">
            <!-- Dynamic Project Content Rendered Here -->
            <div class="text-center py-20">
                <div class="inline-block w-8 h-8 border-4 border-sky-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                <p class="text-slate-400 text-sm">Loading project details...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 py-5 text-center text-xs text-slate-600">
        <p>© 2026 MOHAMMED BABEKER. All rights reserved.</p>
    </footer>

    <!-- JavaScript Engine for Project Details -->
    <script>
        let currentLang = 'en';
        let projectData = null;

        function fixImgUrl(url) {
            if (!url) return '';
            if (url.startsWith('http')) return url;
            let path = url.startsWith('/') ? url : '/' + url;
            if (!path.startsWith('/public/')) {
                path = '/public' + path;
            }
            return encodeURI(path);
        }

        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        function renderProject() {
            if (!projectData) return;
            const p = projectData;
            const lang = currentLang;

            document.getElementById('txt-back').innerText = lang === 'ar' ? '← العودة للرئيسية' : '← Back to Home';

            const title = lang === 'ar' ? p.title_ar : p.title_en;
            const tag = lang === 'ar' ? p.tag_ar : p.tag_en;
            const desc = lang === 'ar' ? p.desc_ar : p.desc_en;
            const fullDesc = lang === 'ar' ? p.full_desc_ar : p.full_desc_en;

            document.getElementById('pageTitle').innerText = `${title} | MOHAMMED BABEKER`;

            let html = `
                <!-- Project Header Meta -->
                <div class="mb-8">
                    <span class="inline-block px-3.5 py-1 rounded-full bg-sky-500/25 border border-sky-400/40 text-sky-300 text-xs font-bold mb-3">
                        ${tag || 'Architecture'}
                    </span>
                    <h1 class="text-2xl sm:text-4xl md:text-5xl font-black text-white mb-4 leading-tight">${title}</h1>
                    <p class="text-slate-300 text-sm sm:text-base leading-relaxed mb-6">${desc}</p>
                    
                    <!-- Meta Grid (Year, Client, Location) -->
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 p-4 rounded-2xl bg-slate-900 border border-slate-800 text-xs">
                        <div>
                            <span class="text-slate-500 block mb-0.5">${lang === 'ar' ? 'سنة التنفيذ' : 'Execution Year'}</span>
                            <span class="text-white font-bold">${p.year || '2026'}</span>
                        </div>
                        <div>
                            <span class="text-slate-500 block mb-0.5">${lang === 'ar' ? 'العميل' : 'Client'}</span>
                            <span class="text-white font-bold">${p.client || (lang === 'ar' ? 'قطاع خاص / حكومي' : 'Private / Government')}</span>
                        </div>
                        <div class="col-span-2 sm:col-span-1">
                            <span class="text-slate-500 block mb-0.5">${lang === 'ar' ? 'الموقع' : 'Location'}</span>
                            <span class="text-white font-bold">${p.location || (lang === 'ar' ? 'الرياض، السعودية' : 'Riyadh, KSA')}</span>
                        </div>
                    </div>
                </div>

                <!-- Main Hero Image -->
                <div class="rounded-3xl overflow-hidden border border-slate-800 shadow-2xl mb-10 h-72 sm:h-[450px] bg-slate-900">
                    <img src="${fixImgUrl(p.image)}" alt="${title}" class="w-full h-full object-cover">
                </div>

                <!-- Full Narrative Description -->
                ${fullDesc ? `
                <div class="p-6 sm:p-8 rounded-3xl bg-slate-900/60 border border-slate-800 mb-10">
                    <h3 class="text-lg font-bold text-white mb-3">${lang === 'ar' ? 'فكرة التصميم والتفاصيل الهندسية' : 'Design Concept & Architectural Details'}</h3>
                    <p class="text-slate-300 text-xs sm:text-sm leading-relaxed whitespace-pre-line">${fullDesc}</p>
                </div>
                ` : ''}

                <!-- Gallery Section (Multiple Images) -->
                ${p.gallery && p.gallery.length > 0 ? `
                <div class="mb-10">
                    <h3 class="text-lg font-extrabold text-white mb-6">${lang === 'ar' ? 'معرض الصور واللقطات الهندسية' : 'Project Gallery & Visuals'}</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        ${p.gallery.map(g => `
                            <div class="rounded-2xl overflow-hidden border border-slate-800 bg-slate-900 group">
                                <div class="h-64 sm:h-72 overflow-hidden">
                                    <img src="${fixImgUrl(g.img)}" alt="Gallery item" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                </div>
                                ${g.caption ? `<div class="p-3 text-center text-slate-400 text-xs font-medium">${g.caption}</div>` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
                ` : ''}
            `;

            document.getElementById('projectContainer').innerHTML = html;
        }

        function switchLanguage(lang) {
            currentLang = lang;
            document.getElementById('langEnBtn').className = lang === 'en' ? 'px-2.5 py-1 rounded-lg bg-sky-500 text-white transition-all' : 'px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition-all';
            document.getElementById('langArBtn').className = lang === 'ar' ? 'px-2.5 py-1 rounded-lg bg-sky-500 text-white transition-all' : 'px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition-all';
            
            document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            document.documentElement.setAttribute('lang', lang);

            renderProject();
        }

        // Fetch Project Data on Load
        document.addEventListener('DOMContentLoaded', async () => {
            const projectId = getQueryParams();
            try {
                const res = await fetch('/content/projects.json');
                if (res.ok) {
                    const data = await res.json();
                    if (data.items) {
                        projectData = data.items.find(item => item.id === projectId) || data.items[0];
                        renderProject();
                    }
                }
            } catch (e) {
                console.log("Error loading project details", e);
            }
        });
    </script>
</body>
</html>
