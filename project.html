<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Project Details | MOHAMMED BABEKER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <link rel="stylesheet" href="/assets/rich-content.css">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#020617">
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-sky-500 selection:text-white min-h-[100dvh] flex flex-col justify-between">

    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 z-40 bg-slate-950/70 backdrop-blur-md border-b border-slate-800/60 px-4 sm:px-8 py-3 flex justify-between items-center">
        <a href="/" class="flex items-center gap-2.5 text-xs sm:text-lg font-black text-white tracking-wider uppercase whitespace-nowrap">
            <img src="/assets/brand/logo-mark.png" alt="" width="32" height="32" class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg shrink-0">
            <span>MOHAMMED BABEKER<span class="text-sky-500">.</span></span>
        </a>
        
        <div class="flex items-center gap-3">
            <!-- Language Switcher -->
            <div class="inline-flex bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs font-bold">
                <button id="langEnBtn" onclick="switchLanguage('en')" class="px-2.5 py-1 rounded-lg bg-sky-500 text-white transition-all">EN</button>
                <button id="langArBtn" onclick="switchLanguage('ar')" class="px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition-all">عربي</button>
            </div>
            
            <a href="/" class="px-4 py-1.5 rounded-full bg-sky-500 text-white text-xs font-extrabold hover:bg-sky-400 transition-all shadow-lg shadow-sky-500/25">
                <span id="txt-back">← Back to Home</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow pt-24 sm:pt-28 pb-16 px-4 sm:px-6 max-w-5xl mx-auto w-full">
        <div id="projectContainer">
            <!-- Dynamic Project Content Rendered Here -->
            <div class="text-center py-20">
                <div class="inline-block w-8 h-8 border-4 border-sky-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                <p class="text-slate-400 text-sm">Loading project details...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 py-5 text-center text-xs text-slate-600">
        <p>© 2026 MOHAMMED BABEKER. All rights reserved.</p>
    </footer>

    <!-- JavaScript Engine for Project Details -->
    <script src="/assets/site.js"></script>
    <script>
        let currentLang = Site.getInitialLang();
        let rawProject = null;      // ملف المشروع كما تحفظه لوحة التحكم ({ar, en})
        let categories = [];
        let notFound = false;

        function categoryName(key, lang) {
            const c = categories.find(x => x.key === key);
            return c ? (lang === 'ar' ? c.name_ar : (c.name_en || c.name_ar)) : '';
        }

        // معرض المشروع: wide (عرض كامل والنص تحته) / half (صورتان متجاورتان حتى على الهاتف)
        // medium (متوسط في المنتصف) / side (الصورة بجانب النص، مع التبادل يميناً ويساراً تلقائياً)
        // ===== العارض ثلاثي الأبعاد (model-viewer) =====
        function modelUrl(url) {
            if (!url) return '';
            if (/^https?:\/\//.test(url)) return url;
            return encodeURI(url.startsWith('/') ? url : '/' + url);
        }

        function model3dHTML(url, alt) {
            const ar = currentLang === 'ar';
            return `<div class="m3d">
                <model-viewer src="${Site.esc(modelUrl(url))}" alt="${alt}"
                    loading="lazy" reveal="auto"
                    camera-controls disable-zoom disable-pan
                    touch-action="pan-y"
                    auto-rotate auto-rotate-delay="2500" rotation-per-second="14deg"
                    interaction-prompt="auto"
                    shadow-intensity="1" shadow-softness="1"
                    environment-image="neutral" exposure="1.05"
                    camera-orbit="35deg 78deg auto"
                    min-camera-orbit="auto 5deg auto" max-camera-orbit="auto 100deg auto"
                    field-of-view="30deg">
                    <div slot="progress-bar" class="m3d-progress"><span></span></div>
                </model-viewer>
                <div class="m3d-hint">${ar ? 'اسحب للتدوير — انقر مرة لتفعيل التقريب' : 'Drag to rotate — click once to enable zoom'}</div>
            </div>`;
        }

        let modelViewerLoaded = false;
        function initModels(root) {
            const viewers = root.querySelectorAll('model-viewer');
            if (!viewers.length) return;
            if (!modelViewerLoaded) {
                modelViewerLoaded = true;
                const s = document.createElement('script');
                s.type = 'module';
                s.src = 'https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js';
                document.head.appendChild(s);
            }
            // تنزيل النموذج في الخلفية بعد اكتمال الصفحة، فيكون جاهزاً حين يصل إليه الزائر
            const warm = () => viewers.forEach(mv => { mv.setAttribute('loading', 'eager'); });
            if (document.readyState === 'complete') setTimeout(warm, 1200);
            else window.addEventListener('load', () => setTimeout(warm, 1200), { once: true });
            viewers.forEach(mv => {
                const wrap = mv.closest('.m3d');
                // التقريب يتفعّل بعد أول لمسة أو نقرة، حتى لا تعيق عجلة الفأرة تمرير الصفحة
                const enable = () => { mv.removeAttribute('disable-zoom'); mv.removeAttribute('disable-pan'); wrap.classList.add('m3d-active'); };
                mv.addEventListener('pointerdown', enable, { once: true });
                mv.addEventListener('progress', ev => {
                    const bar = mv.querySelector('.m3d-progress span');
                    if (bar) bar.style.width = Math.round(ev.detail.totalProgress * 100) + '%';
                    if (ev.detail.totalProgress >= 1) mv.querySelector('.m3d-progress')?.classList.add('done');
                });
            });
        }

        function renderGallery(gallery, projectTitle) {
            const e = Site.esc;
            let sideIndex = 0;
            return gallery.filter(g => g && (g.img || g.model || g.text)).map(g => {
                if (!g.img && !g.model) {
                    // قسم نصي بلا صورة
                    return `<section class="gal-wide gal-textonly">
                        ${g.caption ? `<h3 class="gal-title">${e(g.caption)}</h3>` : ''}
                        <div class="gal-text rich-content">${Site.renderRichText(g.text)}</div>
                    </section>`;
                }
                const alt = e(g.caption || projectTitle);
                let img;
                if (g.model) {
                    // نموذج ثلاثي الأبعاد قابل للتدوير والتقريب
                    img = model3dHTML(g.model, alt);
                } else {
                    const src = e(Site.fixImgUrl(g.img));
                    img = `<a href="${src}" target="_blank" rel="noopener" class="gal-img"><img src="${src}" alt="${alt}" loading="lazy"></a>`;
                }
                const text = g.text ? Site.renderRichText(g.text) : '';
                const size = ['wide', 'half', 'medium', 'side', 'board'].includes(g.size) ? g.size : 'wide';
                if (size === 'board') {
                    // لوحة متداخلة: نص + بطاقة فكرة + شريط عريض + بطاقة ثانية (كتصميم لوحة العرض المطبوعة)
                    const pic = (u, cls) => u ? `<a href="${e(Site.fixImgUrl(u))}" target="_blank" rel="noopener" class="${cls}"><img src="${e(Site.fixImgUrl(u))}" alt="${alt}" loading="lazy"></a>` : '';
                    return `<section class="board">
                        <div class="b-text1">${g.caption ? `<h3 class="gal-title">${e(g.caption)}</h3>` : ''}${text ? `<div class="gal-text rich-content">${text}</div>` : ''}</div>
                        ${pic(g.img2, 'b-card b-card1')}
                        ${pic(g.img, 'b-strip')}
                        ${pic(g.img3, 'b-card b-card2')}
                        <div class="b-text2">${g.text2 ? `<div class="gal-text rich-content">${Site.renderRichText(g.text2)}</div>` : ''}</div>
                    </section>`;
                }
                if (size === 'side') {
                    const rev = sideIndex++ % 2 === 1 ? ' rev' : '';
                    return `<section class="gal-side${rev}">
                        <div class="gs-img">${img}</div>
                        <div class="gs-head">${g.caption ? `<h3 class="gal-title">${e(g.caption)}</h3>` : ''}</div>
                        <div class="gs-body">${text ? `<div class="gal-text rich-content">${text}</div>` : ''}</div>
                    </section>`;
                }
                const longText = text && (text.length > 600 || /<ol|<ul/.test(text));
                const caption = !g.caption ? '' : text
                    ? `<h3 class="gal-title gal-title-below">${e(g.caption)}</h3>`
                    : `<figcaption class="gal-cap">${e(g.caption)}</figcaption>`;
                return `<figure class="gal-${size}">
                    ${img}
                    ${caption}
                    ${text ? `<div class="gal-text rich-content${longText ? ' cols' : ''}">${text}</div>` : ''}
                </figure>`;
            }).join('');
        }

        function renderProject() {
            const lang = currentLang;
            const box = document.getElementById('projectContainer');
            if (notFound) {
                Site.setMeta(lang === 'ar' ? 'المشروع غير موجود' : 'Project not found');
                box.innerHTML = Site.notFoundHTML(lang, { ar: 'هذا المشروع', en: 'project' });
                return;
            }
            if (!rawProject) return;
            const p = Site.localize(rawProject, lang);
            const e = Site.esc;
            const tag = categoryName(p.category, lang) || (lang === 'ar' ? 'مشروع' : 'Project');
            Site.setMeta(p.title, p.seo_description || p.summary);

            const meta = [
                [lang === 'ar' ? 'السنة' : 'Year', p.year],
                [lang === 'ar' ? 'العميل' : 'Client', p.client],
                [lang === 'ar' ? 'الموقع' : 'Location', p.location]
            ].filter(m => m[1]);

            box.innerHTML = `
                <div class="mb-8">
                    <span class="inline-block px-3.5 py-1 rounded-full bg-sky-500/25 border border-sky-400/40 text-sky-300 text-xs font-bold mb-3">${e(tag)}</span>
                    <h1 class="text-2xl sm:text-4xl md:text-5xl font-black text-white mb-4 leading-tight">${e(p.title)}</h1>
                    ${p.summary ? `<p class="text-slate-300 text-sm sm:text-base leading-relaxed mb-6">${e(p.summary)}</p>` : ''}
                    ${meta.length ? `
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 p-4 rounded-2xl bg-slate-900 border border-slate-800 text-xs">
                        ${meta.map(m => `<div><span class="text-slate-500 block mb-0.5">${m[0]}</span><span class="text-white font-bold">${e(m[1])}</span></div>`).join('')}
                    </div>` : ''}
                </div>

                ${p.cover ? `
                <div class="rounded-3xl overflow-hidden border border-slate-800 shadow-2xl mb-10 bg-slate-900">
                    <img src="${e(Site.fixImgUrl(p.cover))}" alt="${e(p.title)}" class="w-full h-auto block">
                </div>` : ''}

                ${p.body ? `
                <div class="p-6 sm:p-8 rounded-3xl bg-slate-900/60 border border-slate-800 mb-10">
                    <div class="rich-content">${Site.renderRichText(p.body)}</div>
                </div>` : ''}

                ${Array.isArray(p.gallery) && p.gallery.length ? `
                <div class="mb-10">
                    <div class="gal">${renderGallery(p.gallery, p.title)}</div>
                </div>` : ''}
            `;
            initModels(box);
        }

        function switchLanguage(lang, remember = true) {
            currentLang = lang;
            if (remember) Site.rememberLang(lang);
            Site.applyDir(lang);
            renderProject();
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const match = location.pathname.match(/^\/projects\/([^\/]+)\/?$/);
            const key = match ? decodeURIComponent(match[1]) : new URLSearchParams(location.search).get('id');
            try {
                const [index, cats] = await Promise.all([
                    Site.getJSON('/content/_index/projects.json'),
                    Site.getJSON('/content/categories.json').catch(() => ({ items: [] }))
                ]);
                categories = cats.items || [];
                // يقبل الرابط النظيف، أو المعرّف القديم (p3) لدعم الروابط القديمة
                const entry = key && index.find(it => it.slug === key || it.ar.legacy_id === key);
                if (!entry) {
                    notFound = true;
                } else {
                    rawProject = await Site.getJSON('/content/projects/' + encodeURIComponent(entry.file));
                    const canonical = '/projects/' + entry.slug;
                    if (location.pathname + location.search !== canonical) history.replaceState(null, '', canonical);
                }
            } catch (err) {
                console.log('Error loading project', err);
                notFound = true;
            }
            switchLanguage(currentLang, false);
        });
    </script>
</body>
</html>
