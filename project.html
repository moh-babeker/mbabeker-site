<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Project Details | MOHAMMED BABEKER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <link rel="stylesheet" href="/assets/rich-content.css">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#020617">
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-sky-500 selection:text-white min-h-[100dvh] flex flex-col justify-between">

    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 z-40 bg-slate-950/70 backdrop-blur-md border-b border-slate-800/60 px-4 sm:px-8 py-3 flex justify-between items-center">
        <a href="/" class="flex items-center gap-2.5 text-xs sm:text-lg font-black text-white tracking-wider uppercase whitespace-nowrap">
            <img src="/assets/brand/logo-mark.png" alt="" width="32" height="32" class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg shrink-0">
            <span>MOHAMMED BABEKER<span class="text-sky-500">.</span></span>
        </a>
        
        <div class="flex items-center gap-3">
            <!-- Language Switcher -->
            <div class="inline-flex bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs font-bold">
                <button id="langEnBtn" onclick="switchLanguage('en')" class="px-2.5 py-1 rounded-lg bg-sky-500 text-white transition-all">EN</button>
                <button id="langArBtn" onclick="switchLanguage('ar')" class="px-2.5 py-1 rounded-lg text-slate-400 hover:text-white transition-all">عربي</button>
            </div>
            
            <a href="/" class="px-4 py-1.5 rounded-full bg-sky-500 text-white text-xs font-extrabold hover:bg-sky-400 transition-all shadow-lg shadow-sky-500/25">
                <span id="txt-back">← Back to Home</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow pt-24 sm:pt-28 pb-16 px-4 sm:px-6 max-w-5xl mx-auto w-full">
        <div id="projectContainer">
            <!-- Dynamic Project Content Rendered Here -->
            <div class="text-center py-20">
                <div class="inline-block w-8 h-8 border-4 border-sky-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                <p class="text-slate-400 text-sm">Loading project details...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 py-5 text-center text-xs text-slate-600">
        <p>© 2026 MOHAMMED BABEKER. All rights reserved.</p>
    </footer>

    <!-- JavaScript Engine for Project Details -->
    <script src="/assets/site.js"></script>
    <script>
        let currentLang = Site.getInitialLang();
        let rawProject = null;      // ملف المشروع كما تحفظه لوحة التحكم ({ar, en})
        let categories = [];
        let notFound = false;

        function categoryName(key, lang) {
            const c = categories.find(x => x.key === key);
            return c ? (lang === 'ar' ? c.name_ar : (c.name_en || c.name_ar)) : '';
        }

        function renderProject() {
            const lang = currentLang;
            const box = document.getElementById('projectContainer');
            if (notFound) {
                Site.setMeta(lang === 'ar' ? 'المشروع غير موجود' : 'Project not found');
                box.innerHTML = Site.notFoundHTML(lang, { ar: 'هذا المشروع', en: 'project' });
                return;
            }
            if (!rawProject) return;
            const p = Site.localize(rawProject, lang);
            const e = Site.esc;
            const tag = categoryName(p.category, lang) || (lang === 'ar' ? 'مشروع' : 'Project');
            Site.setMeta(p.title, p.seo_description || p.summary);

            const meta = [
                [lang === 'ar' ? 'سنة التنفيذ' : 'Year', p.year],
                [lang === 'ar' ? 'العميل' : 'Client', p.client],
                [lang === 'ar' ? 'الموقع' : 'Location', p.location]
            ].filter(m => m[1]);

            box.innerHTML = `
                <div class="mb-8">
                    <span class="inline-block px-3.5 py-1 rounded-full bg-sky-500/25 border border-sky-400/40 text-sky-300 text-xs font-bold mb-3">${e(tag)}</span>
                    <h1 class="text-2xl sm:text-4xl md:text-5xl font-black text-white mb-4 leading-tight">${e(p.title)}</h1>
                    ${p.summary ? `<p class="text-slate-300 text-sm sm:text-base leading-relaxed mb-6">${e(p.summary)}</p>` : ''}
                    ${meta.length ? `
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 p-4 rounded-2xl bg-slate-900 border border-slate-800 text-xs">
                        ${meta.map(m => `<div><span class="text-slate-500 block mb-0.5">${m[0]}</span><span class="text-white font-bold">${e(m[1])}</span></div>`).join('')}
                    </div>` : ''}
                </div>

                ${p.cover ? `
                <div class="rounded-3xl overflow-hidden border border-slate-800 shadow-2xl mb-10 h-72 sm:h-[450px] bg-slate-900">
                    <img src="${e(Site.fixImgUrl(p.cover))}" alt="${e(p.title)}" class="w-full h-full object-cover">
                </div>` : ''}

                ${p.body ? `
                <div class="p-6 sm:p-8 rounded-3xl bg-slate-900/60 border border-slate-800 mb-10">
                    <div class="rich-content">${Site.renderRichText(p.body)}</div>
                </div>` : ''}

                ${Array.isArray(p.gallery) && p.gallery.length ? `
                <div class="mb-10">
                    <h3 class="text-lg font-extrabold text-white mb-6">${lang === 'ar' ? 'معرض الصور واللقطات الهندسية' : 'Project Gallery & Visuals'}</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        ${p.gallery.filter(g => g && g.img).map(g => `
                            <div class="rounded-2xl overflow-hidden border border-slate-800 bg-slate-900 group">
                                <div class="h-64 sm:h-72 overflow-hidden">
                                    <img src="${e(Site.fixImgUrl(g.img))}" alt="${e(g.caption || p.title)}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                </div>
                                ${g.caption ? `<div class="p-3 text-center text-slate-400 text-xs font-medium">${e(g.caption)}</div>` : ''}
                            </div>`).join('')}
                    </div>
                </div>` : ''}
            `;
        }

        function switchLanguage(lang, remember = true) {
            currentLang = lang;
            if (remember) Site.rememberLang(lang);
            Site.applyDir(lang);
            renderProject();
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const match = location.pathname.match(/^\/projects\/([^\/]+)\/?$/);
            const key = match ? decodeURIComponent(match[1]) : new URLSearchParams(location.search).get('id');
            try {
                const [index, cats] = await Promise.all([
                    Site.getJSON('/content/_index/projects.json'),
                    Site.getJSON('/content/categories.json').catch(() => ({ items: [] }))
                ]);
                categories = cats.items || [];
                // يقبل الرابط النظيف، أو المعرّف القديم (p3) لدعم الروابط القديمة
                const entry = key && index.find(it => it.slug === key || it.ar.legacy_id === key);
                if (!entry) {
                    notFound = true;
                } else {
                    rawProject = await Site.getJSON('/content/projects/' + encodeURIComponent(entry.file));
                    const canonical = '/projects/' + entry.slug;
                    if (location.pathname + location.search !== canonical) history.replaceState(null, '', canonical);
                }
            } catch (err) {
                console.log('Error loading project', err);
                notFound = true;
            }
            switchLanguage(currentLang, false);
        });
    </script>
</body>
</html>
