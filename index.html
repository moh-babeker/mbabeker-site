<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محمد بابكر | استشاري معماري ومتخصص BIM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; }
    .modal-backdrop { background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); }
  </style>
</head>
<body class="bg-stone-950 text-stone-100 min-h-screen selection:bg-amber-500 selection:text-stone-950">

  <!-- Navigation -->
  <nav class="fixed top-0 w-full z-40 bg-stone-950/80 backdrop-blur-md border-b border-stone-800">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="#" class="text-xl font-bold tracking-tight flex items-center gap-3">
        <img id="nav-avatar" class="w-9 h-9 rounded-full object-cover border border-amber-500/30 hidden" src="" alt="Logo">
        <span id="nav-name" class="bg-gradient-to-r from-amber-200 to-amber-500 bg-clip-text text-transparent">M. BABEKER</span>
      </a>
      <div class="flex items-center gap-6 text-sm font-medium">
        <a href="#projects" class="hover:text-amber-400 transition">المشاريع</a>
        <a href="#about" class="hover:text-amber-400 transition">عني</a>
        <a id="cv-btn" href="#" target="_blank" class="hidden px-4 py-2 rounded-lg bg-stone-800 hover:bg-stone-700 border border-stone-700 text-amber-400 transition">السيرة الذاتية PDF</a>
        <a href="/admin/" class="px-3 py-1.5 rounded-lg bg-amber-500/10 text-amber-400 border border-amber-500/20 hover:bg-amber-500/20 transition">لوحة التحكم</a>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="pt-36 pb-20 px-6 max-w-7xl mx-auto text-center md:text-right">
    <div class="flex flex-col md:flex-row items-center gap-10">
      <img id="hero-img" class="w-40 h-40 md:w-52 md:h-52 rounded-2xl object-cover border-2 border-amber-500/30 shadow-2xl shadow-amber-500/10 hidden" src="" alt="Profile">
      <div class="space-y-4 flex-1">
        <h1 id="hero-name" class="text-4xl md:text-6xl font-black text-stone-100">...</h1>
        <p id="hero-title" class="text-xl md:text-2xl font-semibold text-amber-400">...</p>
        <p id="hero-bio" class="text-stone-400 max-w-2xl leading-relaxed text-base md:text-lg">...</p>
        <div class="pt-4 flex flex-wrap gap-4 justify-center md:justify-start">
          <a id="whatsapp-btn" href="#" target="_blank" class="px-6 py-3 rounded-xl bg-amber-500 text-stone-950 font-bold hover:bg-amber-400 transition shadow-lg shadow-amber-500/20">تواصل عبر الواتساب</a>
        </div>
      </div>
    </div>
  </section>

  <!-- Projects Grid -->
  <section id="projects" class="py-20 px-6 max-w-7xl mx-auto border-t border-stone-800/80">
    <div class="flex justify-between items-end mb-12">
      <div>
        <h2 class="text-3xl font-bold text-stone-100">معرض المشاريع المعمارية</h2>
        <p class="text-stone-400 mt-2">تصفح أحدث الأعمال، الدراسات، والتصاميم الحضرية والهندسية</p>
      </div>
    </div>

    <!-- Filter Buttons -->
    <div class="flex flex-wrap gap-3 mb-10">
      <button onclick="filterProjects('all')" class="filter-btn active px-5 py-2 rounded-xl bg-amber-500 text-stone-950 font-semibold text-sm transition">الكل</button>
      <button onclick="filterProjects('arch')" class="filter-btn px-5 py-2 rounded-xl bg-stone-900 border border-stone-800 text-stone-300 hover:border-amber-500/50 text-sm transition">معماري</button>
      <button onclick="filterProjects('urban')" class="filter-btn px-5 py-2 rounded-xl bg-stone-900 border border-stone-800 text-stone-300 hover:border-amber-500/50 text-sm transition">تخطيط حضري</button>
      <button onclick="filterProjects('interior')" class="filter-btn px-5 py-2 rounded-xl bg-stone-900 border border-stone-800 text-stone-300 hover:border-amber-500/50 text-sm transition">تصميم داخلي</button>
      <button onclick="filterProjects('bim')" class="filter-btn px-5 py-2 rounded-xl bg-stone-900 border border-stone-800 text-stone-300 hover:border-amber-500/50 text-sm transition">BIM</button>
    </div>

    <!-- Grid Container -->
    <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- Projects dynamic load -->
    </div>
  </section>

  <!-- Dynamic Project Modal (تفاصيل المشروع ومعرض الصور) -->
  <div id="project-modal" class="fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4 md:p-8 hidden overflow-y-auto">
    <div class="bg-stone-900 border border-stone-800 rounded-3xl max-w-4xl w-full max-h-[90vh] overflow-y-auto p-6 md:p-10 relative space-y-8">
      <button onclick="closeModal()" class="absolute top-6 left-6 w-10 h-10 rounded-full bg-stone-800 hover:bg-stone-700 text-stone-300 flex items-center justify-center text-xl transition">✕</button>
      
      <div class="space-y-3">
        <span id="modal-cat" class="px-3 py-1 rounded-md bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs font-bold"></span>
        <h3 id="modal-title" class="text-3xl font-bold text-stone-100"></h3>
        <p id="modal-meta" class="text-stone-400 text-sm"></p>
      </div>

      <!-- Main Cover -->
      <img id="modal-main-img" class="w-full h-80 md:h-[420px] rounded-2xl object-cover border border-stone-800" src="" alt="Main Cover">

      <!-- Details Markdown/Text -->
      <div id="modal-details" class="prose prose-invert max-w-none text-stone-300 leading-relaxed space-y-4"></div>

      <!-- Multi-Image Gallery -->
      <div class="space-y-4 pt-4 border-t border-stone-800">
        <h4 class="text-lg font-bold text-amber-400">معرض صور وتفاصيل المشروع</h4>
        <div id="modal-gallery" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </div>
    </div>
  </div>

  <!-- JavaScript Dynamic Engine -->
  <script>
    let allProjects = [];

    // Load Data
    async function initData() {
      try {
        // Load Settings
        const resSet = await fetch('/content/settings.json');
        if (resSet.ok) {
          const s = await resSet.json();
          document.getElementById('hero-name').innerText = s.name_ar || s.name_en;
          document.getElementById('nav-name').innerText = s.name_en;
          document.getElementById('hero-title').innerText = s.title_ar || s.title_en;
          document.getElementById('hero-bio').innerText = s.bio_ar || s.bio_en;
          
          if(s.profile_image) {
            document.getElementById('hero-img').src = s.profile_image;
            document.getElementById('hero-img').classList.remove('hidden');
            document.getElementById('nav-avatar').src = s.profile_image;
            document.getElementById('nav-avatar').classList.remove('hidden');
          }
          if(s.whatsapp) {
            document.getElementById('whatsapp-btn').href = `https://wa.me/${s.whatsapp.replace(/[^0-9]/g, '')}`;
          }
          if(s.cv_file) {
            const cvBtn = document.getElementById('cv-btn');
            cvBtn.href = s.cv_file;
            cvBtn.classList.remove('hidden');
          }
        }

        // Load Projects
        const resProj = await fetch('/content/projects.json');
        if (resProj.ok) {
          const p = await resProj.json();
          allProjects = p.items || [];
          renderProjects(allProjects);
        }
      } catch (err) {
        console.error('Error loading content:', err);
      }
    }

    function renderProjects(items) {
      const grid = document.getElementById('projects-grid');
      grid.innerHTML = '';

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'group bg-stone-900 border border-stone-800/80 rounded-2xl overflow-hidden hover:border-amber-500/40 transition duration-300 cursor-pointer flex flex-col';
        card.onclick = () => openModal(item);

        card.innerHTML = `
          <div class="relative h-64 overflow-hidden bg-stone-800">
            <img src="${item.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" alt="${item.title_ar}">
            <span class="absolute top-4 right-4 bg-stone-950/80 backdrop-blur-md px-3 py-1 rounded-lg text-amber-400 text-xs font-semibold border border-stone-700">${item.category.toUpperCase()}</span>
          </div>
          <div class="p-6 flex-1 flex flex-col justify-between space-y-4">
            <div>
              <h3 class="text-xl font-bold text-stone-100 group-hover:text-amber-400 transition">${item.title_ar || item.title_en}</h3>
              <p class="text-stone-400 text-sm mt-2 line-clamp-2">${item.desc_ar || item.desc_en}</p>
            </div>
            <div class="pt-4 border-t border-stone-800/60 flex justify-between items-center text-xs text-stone-500">
              <span>${item.location || ''}</span>
              <span>${item.year || ''}</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterProjects(cat) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('bg-amber-500', 'text-stone-950'));
      event.target.classList.add('bg-amber-500', 'text-stone-950');

      if (cat === 'all') {
        renderProjects(allProjects);
      } else {
        renderProjects(allProjects.filter(p => p.category === cat));
      }
    }

    function openModal(item) {
      document.getElementById('modal-title').innerText = item.title_ar || item.title_en;
      document.getElementById('modal-cat').innerText = (item.category || '').toUpperCase();
      document.getElementById('modal-meta').innerText = `${item.location || ''} ${item.year ? '• ' + item.year : ''} ${item.area ? '• ' + item.area : ''}`;
      document.getElementById('modal-main-img').src = item.image;
      document.getElementById('modal-details').innerText = item.details || item.desc_ar || '';

      const gal = document.getElementById('modal-gallery');
      gal.innerHTML = '';
      if (item.gallery && item.gallery.length > 0) {
        item.gallery.forEach(imgUrl => {
          const img = document.createElement('img');
          img.src = imgUrl;
          img.className = 'w-full h-56 object-cover rounded-xl border border-stone-800 hover:scale-102 transition';
          gal.appendChild(img);
        });
      } else {
        gal.parentElement.classList.add('hidden');
      }

      document.getElementById('project-modal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('project-modal').classList.add('hidden');
      document.body.style.overflow = 'auto';
    }

    window.onload = initData;
  </script>
</body>
</html>
