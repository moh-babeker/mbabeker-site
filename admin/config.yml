backend:
  name: github
  repo: moh-babeker/mbabeker-site
  branch: main

media_folder: "public/images"
public_folder: "/public/images"

# اللغات: كل مدخل يُكتب في تبويبين (العربية أولاً)
i18n:
  structure: single_file
  locales: [ar, en]
  default_locale: ar

collections:
  # ================================================================
  # المشاريع — كل مشروع مدخل مستقل (مثل مقالات وردبريس)
  # ================================================================
  - name: "projects"
    label: "المشاريع"
    label_singular: "مشروع"
    description: "أضف مشروعاً جديداً أو عدّل مشروعاً قائماً. الحقول المترجمة تظهر في تبويبَي العربية والإنجليزية."
    icon: "apartment"
    folder: "content/projects"
    extension: "json"
    format: "json"
    create: true
    delete: true
    i18n: true
    identifier_field: "slug"
    slug: "{{slug}}"
    summary: "{{title}}"
    thumbnail: "cover"
    sortable_fields: ["order", "title", "year"]
    view_groups:
      - { label: "التصنيف", field: "category" }
      - { label: "حالة النشر", field: "published" }
    fields:
      - label: "عنوان المشروع"
        name: "title"
        widget: "string"
        i18n: true
        required: [ar]
      - label: "الرابط النظيف"
        name: "slug"
        widget: "string"
        hint: "بالإنجليزية الصغيرة والشرطات، مثل: rural-health-center ← mbabeker.com/projects/rural-health-center"
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "أحرف إنجليزية صغيرة وأرقام وشرطات فقط، بلا مسافات"]
      - label: "منشور في الموقع"
        name: "published"
        widget: "boolean"
        default: true
        hint: "أطفئه ليبقى المشروع مسودة لا تظهر للزوار"
      - label: "التصنيف"
        name: "category"
        widget: "relation"
        collection: "taxonomy"
        file: "categories"
        value_field: "items.*.key"
        display_fields: ["items.*.name_ar"]
        search_fields: ["items.*.name_ar", "items.*.name_en"]
        hint: "تُدار التصنيفات من قسم «تصنيفات المشاريع»، ويمكن اختيار تصنيف رئيسي أو فرعي"
      - label: "ترتيب الظهور"
        name: "order"
        widget: "number"
        value_type: "int"
        required: false
        default: 10
        hint: "الرقم الأصغر يظهر أولاً في معرض الأعمال"
      - label: "صورة الغلاف"
        name: "cover"
        widget: "image"
        hint: "تظهر في بطاقة المشروع وأعلى صفحته"
      - label: "وصف قصير للبطاقة"
        name: "summary"
        widget: "text"
        i18n: true
        required: false
      - label: "سنة التنفيذ"
        name: "year"
        widget: "string"
        required: false
      - label: "العميل / الجهة"
        name: "client"
        widget: "string"
        i18n: true
        required: false
      - label: "الموقع الجغرافي"
        name: "location"
        widget: "string"
        i18n: true
        required: false
      - label: "المحتوى التفصيلي"
        name: "body"
        widget: "markdown"
        i18n: true
        required: false
        buttons: [bold, italic, link, heading-one, heading-two, heading-three, quote, bulleted-list, numbered-list, code]
        editor_components: [image]
        hint: "لحجم الصورة أو موضعها اكتب في خانة عنوانها (Title) كلمة: wide (عريض) / full (كامل) / half (نصف) / small (صغير) / right (يمين) / left (يسار)، وما بعدها يظهر تعليقاً تحت الصورة"
      - label: "معرض الصور"
        name: "gallery"
        widget: "list"
        i18n: duplicate
        required: false
        summary: "{{fields.caption}}"
        fields:
          - { label: "صورة", name: "img", widget: "image", i18n: duplicate }
          - { label: "تعليق على الصورة", name: "caption", widget: "string", i18n: true, required: false }
      - label: "وصف محركات البحث (SEO)"
        name: "seo_description"
        widget: "text"
        i18n: true
        required: false
        hint: "جملة أو جملتان تظهران في نتائج جوجل"
      - { name: "legacy_id", widget: "hidden", required: false }

  # ================================================================
  # تصنيفات المشاريع — تبويبات معرض الأعمال (قابلة للإضافة والحذف والترتيب)
  # ================================================================
  - name: "taxonomy"
    label: "تصنيفات المشاريع"
    icon: "category"
    description: "هذه هي تبويبات معرض الأعمال. اسحب لإعادة الترتيب، واختر «التصنيف الأب» لتجعل التصنيف فرعياً داخل تبويب آخر."
    files:
      - name: "categories"
        label: "قائمة التصنيفات"
        file: "content/categories.json"
        fields:
          - label: "التصنيفات"
            name: "items"
            widget: "list"
            summary: "{{fields.name_ar}} — {{fields.name_en}}"
            hint: "ترتيب القائمة هنا هو ترتيب التبويبات في الموقع. تبويب «الكل» ثابت دائماً."
            fields:
              - { label: "الاسم (عربي)", name: "name_ar", widget: "string" }
              - { label: "الاسم (English)", name: "name_en", widget: "string" }
              - label: "المعرّف"
                name: "key"
                widget: "string"
                hint: "كلمة إنجليزية قصيرة فريدة، مثل: healthcare — لا تغيّرها بعد ربط مشاريع بها"
                pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "أحرف إنجليزية صغيرة وأرقام وشرطات فقط"]
              - label: "التصنيف الأب (اختياري)"
                name: "parent"
                widget: "relation"
                collection: "taxonomy"
                file: "categories"
                value_field: "items.*.key"
                display_fields: ["items.*.name_ar"]
                search_fields: ["items.*.name_ar", "items.*.name_en"]
                required: false
                hint: "اتركه فارغاً ليكون تبويباً رئيسياً، أو اختر تبويباً ليظهر هذا التصنيف داخله"

  # ================================================================
  # المقالات
  # ================================================================
  - name: "articles"
    label: "المقالات"
    label_singular: "مقال"
    description: "مقالات وأخبار تظهر على mbabeker.com/articles"
    icon: "article"
    folder: "content/articles"
    extension: "json"
    format: "json"
    create: true
    delete: true
    i18n: true
    identifier_field: "slug"
    slug: "{{slug}}"
    summary: "{{title}}"
    thumbnail: "cover"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "عنوان المقال", name: "title", widget: "string", i18n: true, required: [ar] }
      - label: "الرابط النظيف"
        name: "slug"
        widget: "string"
        hint: "بالإنجليزية الصغيرة والشرطات، مثل: green-urban-floors ← mbabeker.com/articles/green-urban-floors"
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "أحرف إنجليزية صغيرة وأرقام وشرطات فقط، بلا مسافات"]
      - { label: "منشور في الموقع", name: "published", widget: "boolean", default: true }
      - { label: "تاريخ النشر", name: "date", widget: "datetime", time_format: false, date_format: "YYYY-MM-DD", format: "YYYY-MM-DD" }
      - { label: "التصنيف", name: "category", widget: "string", i18n: true, required: false }
      - { label: "صورة الغلاف", name: "cover", widget: "image", required: false }
      - { label: "مقتطف قصير", name: "excerpt", widget: "text", i18n: true, required: false, hint: "يظهر في قائمة المقالات" }
      - label: "نص المقال"
        name: "body"
        widget: "markdown"
        i18n: true
        required: false
        buttons: [bold, italic, link, heading-one, heading-two, heading-three, quote, bulleted-list, numbered-list, code]
        editor_components: [image]
        hint: "لحجم الصورة اكتب في خانة عنوانها: wide / full / half / small / right / left"
      - { label: "وصف محركات البحث (SEO)", name: "seo_description", widget: "text", i18n: true, required: false }

  # ================================================================
  # الصفحات المستقلة
  # ================================================================
  - name: "pages"
    label: "الصفحات"
    label_singular: "صفحة"
    description: "صفحات مستقلة مثل الخدمات أو سياسة الخصوصية، رابطها mbabeker.com/اسم-الصفحة"
    icon: "description"
    folder: "content/pages"
    extension: "json"
    format: "json"
    create: true
    delete: true
    i18n: true
    identifier_field: "slug"
    slug: "{{slug}}"
    summary: "{{title}}"
    sortable_fields: ["menu_order", "title"]
    fields:
      - { label: "عنوان الصفحة", name: "title", widget: "string", i18n: true, required: [ar] }
      - label: "الرابط النظيف"
        name: "slug"
        widget: "string"
        hint: "بالإنجليزية الصغيرة والشرطات، مثل: services ← mbabeker.com/services"
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "أحرف إنجليزية صغيرة وأرقام وشرطات فقط، بلا مسافات"]
      - { label: "منشورة في الموقع", name: "published", widget: "boolean", default: true }
      - { label: "إظهارها في القائمة الجانبية", name: "show_in_menu", widget: "boolean", default: false }
      - { label: "ترتيبها في القائمة", name: "menu_order", widget: "number", value_type: "int", required: false, default: 10 }
      - { label: "صورة الغلاف (اختيارية)", name: "cover", widget: "image", required: false }
      - label: "محتوى الصفحة"
        name: "body"
        widget: "markdown"
        i18n: true
        required: false
        buttons: [bold, italic, link, heading-one, heading-two, heading-three, quote, bulleted-list, numbered-list, code]
        editor_components: [image]
        hint: "لحجم الصورة اكتب في خانة عنوانها: wide / full / half / small / right / left"
      - { label: "وصف محركات البحث (SEO)", name: "seo_description", widget: "text", i18n: true, required: false }

  # 1. إعدادات الموقع العامة والتواصل
  - name: "settings"
    label: "إعدادات الموقع والنصوص"
    files:
      - file: "content/settings.json"
        label: "المعلومات العامة والنصوص (عربي / انجليزي)"
        name: "site_settings"
        fields:
          - { label: "الاسم بالإنجليزية", name: "drawerName_en", widget: "string" }
          - { label: "الاسم بالعربية", name: "drawerName_ar", widget: "string" }
          - { label: "المسمى الوظيفي (EN)", name: "drawerTitle_en", widget: "string" }
          - { label: "المسمى الوظيفي (عربي)", name: "drawerTitle_ar", widget: "string" }
          - { label: "خبرة الخليج (EN)", name: "drawerExp_en", widget: "string" }
          - { label: "خبرة الخليج (عربي)", name: "drawerExp_ar", widget: "string" }
          - { label: "الصورة الشخصية", name: "profile_image", widget: "image", required: false }
          - { label: "صورة خلفية الهيدر الرئيسية", name: "hero_bg_image", widget: "image", required: false }
          - { label: "الموقع الجغرافي (EN)", name: "heroLocation_en", widget: "string" }
          - { label: "الموقع الجغرافي (عربي)", name: "heroLocation_ar", widget: "string" }
          - { label: "البريد الإلكتروني", name: "email", widget: "string" }
          - { label: "رقم الواتساب (مثال: 966597261191)", name: "whatsapp", widget: "string" }
          - { label: "رابط لينكد إن", name: "linkedin", widget: "string" }
          - { label: "رابط ملف السيرة الذاتية PDF", name: "cv_file", widget: "file", required: false }

  # 2. قسم عن المهندس (About Me)
  - name: "about"
    label: "نبذة عني (About)"
    files:
      - file: "content/about.json"
        label: "محتوى صفحة نبذة عني"
        name: "about_content"
        fields:
          - { label: "العنوان الفرعي (EN)", name: "badge_en", widget: "string" }
          - { label: "العنوان الفرعي (عربي)", name: "badge_ar", widget: "string" }
          - { label: "العنوان الرئيسي (EN)", name: "heading_en", widget: "string" }
          - { label: "العنوان الرئيسي (عربي)", name: "heading_ar", widget: "string" }
          - { label: "الوصف التفصيلي (EN)", name: "desc_en", widget: "text" }
          - { label: "الوصف التفصيلي (عربي)", name: "desc_ar", widget: "text" }
          - { label: "رقم الإحصائية 1 (مثال: +9 Yrs)", name: "stat1_num", widget: "string" }
          - { label: "تسمية الإحصائية 1 (EN)", name: "stat1_label_en", widget: "string" }
          - { label: "تسمية الإحصائية 1 (عربي)", name: "stat1_label_ar", widget: "string" }
          - { label: "رقم الإحصائية 2 (مثال: SCE)", name: "stat2_num", widget: "string" }
          - { label: "تسمية الإحصائية 2 (EN)", name: "stat2_label_en", widget: "string" }
          - { label: "تسمية الإحصائية 2 (عربي)", name: "stat2_label_ar", widget: "string" }
          - { label: "عنوان مجالات الخبرة (EN)", name: "expertise_title_en", widget: "string" }
          - { label: "عنوان مجالات الخبرة (عربي)", name: "expertise_title_ar", widget: "string" }
          - label: "قائمة مجالات الخبرة (إضافة/حذف)"
            name: "expertise_list"
            widget: "list"
            fields:
              - { label: "الخبرة (EN)", name: "item_en", widget: "string" }
              - { label: "الخبرة (عربي)", name: "item_ar", widget: "string" }

  # 3. قسم الأبحاث والابتكارات (Research & Innovations)
  - name: "innovations"
    label: "الأبحاث والابتكارات"
    files:
      - file: "content/innovations.json"
        label: "قائمة الأبحاث والأوراق"
        name: "innovations_list"
        fields:
          - label: "الأبحاث"
            name: "items"
            widget: "list"
            fields:
              - { label: "الرقم التسلسلي (مثال: 01)", name: "number", widget: "string" }
              - { label: "عنوان البحث (EN)", name: "title_en", widget: "string" }
              - { label: "عنوان البحث (عربي)", name: "title_ar", widget: "string" }
              - { label: "وصف البحث (EN)", name: "desc_en", widget: "text" }
              - { label: "وصف البحث (عربي)", name: "desc_ar", widget: "text" }
              - { label: "نص الرابط (EN)", name: "link_text_en", widget: "string" }
              - { label: "نص الرابط (عربي)", name: "link_text_ar", widget: "string" }
              - { label: "رابط التفاصيل", name: "url", widget: "string", required: false }

  # 5. الاعتمادات والتراخيص (Credentials)
  - name: "credentials"
    label: "الاعتمادات والتراخيص"
    files:
      - file: "content/credentials.json"
        label: "قائمة الاعتمادات المهنية"
        name: "credentials_list"
        fields:
          - label: "الاعتمادات"
            name: "items"
            widget: "list"
            fields:
              - { label: "اسم الجهة (EN)", name: "title_en", widget: "string" }
              - { label: "اسم الجهة (عربي)", name: "title_ar", widget: "string" }
              - { label: "صفة الترخيص (EN)", name: "sub_en", widget: "string" }
              - { label: "صفة الترخيص (عربي)", name: "sub_ar", widget: "string" }
              - { label: "الوصف والتفاصيل (EN)", name: "desc_en", widget: "text" }
              - { label: "الوصف والتفاصيل (عربي)", name: "desc_ar", widget: "text" }
